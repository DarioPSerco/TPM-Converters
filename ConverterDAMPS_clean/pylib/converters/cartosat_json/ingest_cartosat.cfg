[Main]
CONFIG_NAME=cartosat
MISSION_ID=cartosat
CONFIG_VERSION=cartosat_01
OUTSPACE=TDS\CARTOSAT\OUTSPACE
TMPSPACE=TDS\CARTOSAT\TMPSPACE
DONESPACE=TDS\CARTOSAT\DONESPACE
FAILEDSPACE=TDS\CARTOSAT\FAILEDSPACE
INBOX=TDS\CARTOSAT\INBOX

[Search]
LIST_TYPE=files
# entry file, one per native delivery (the .zip dropped in INBOX is unpacked
# by run_mission.py first; a flat zip goes into a <zip stem>/ folder):
# - IRS-P5 ortho (L3_ORT_PAN): <delivery>_oid.txt at the delivery root; all
#   its EM_Ortho_Image_<n>/ images go in the same package
# - IRS-P5 DSM (L3_DSM____): p5bproductformatter/em3d_<...>_dsm.tif; the
#   acv / num / qc / src layers go with it
# - IRS-P6 ortho: metadata.xml at the root of the flat IR06_..._.BIL.ZIP
# The layout and platform checks are in cartosat_files / product_cartosat.
FILES_NAMEPATTERN=(?i)^(?:.*_oid|em3d_.*_dsm|metadata)$
FILES_EXTPATTERN=(?i)^\.(?:txt|tif|xml)$

[Output]
OUTPUT_RELATIVE_PATH_TREES=[]
OUTPUT_SIP_PATTERN=HIGHTRES_PATTERN_INSTANCE_GENERIC_DDVC
OUTPUT_EO_PATTERN=HIGHTRES_PATTERN_INSTANCE_GENERIC_DDVC

[Mission-specific-values]
METADATA_SIP_CHANGE_LOG=First Issue
METADATA_SIP_SPEC_NAME_VERSION=EOPF-EOS Specialization for IRS-P5 (Cartosat-1) products v1.0
METADATA_SIP_SOFTWARE_NAME=eoProdGen
METADATA_SIP_SOFTWARE_VERSION=1.0.0
# <MMM> = IR5 / IR6 (spec Table 1, applied to IRS-P6 as well) is set per
# product by product_cartosat from the native mission. No default: a product
# whose platform is not recognised must fail, not get a wrong prefix.
METADATA_SENSOR_TYPE=OPTICAL
METADATA_ACQUISITION_TYPE=NOMINAL
METADATA_ACQUISITION_CENTER=UNKNOWN
METADATA_BROWSES_TYPE=QUICKLOOK
METADATA_CODESPACE_REFERENCE_SYSTEM=urn:esa:eop:crs
METADATA_CODESPACE_SENSOR_OPERATIONAL_MODE=urn:esa:eop:IRS:operationalMode
METADATA_RESOLUTION_UNIT=m
METADATA_CREATOR=ESA
METADATA_RESPONSIBLE=ESA
METADATA_REPORT_TYPE=ARCHIVING
METADATA_FILECLASS=OPER
METADATA_STATUS=ARCHIVED
# orbit number of a product that carries none (Euro-Maps 3D DSM tiles)
METADATA_ORBIT=0
METADATA_SIP_VERSION=0100
# <bbvv>: 2 digits product/processor baseline (default 00) + 2 digits counter
# (spec Table 1), set per product by name_registry - no default here.
# Registry of the package names given, {native product: package name};
# relative to the run folder like the spaces above. Keep it with the outputs:
# deleting it lets a package name be given again.
CARTOSAT_NAME_REGISTRY=TDS\CARTOSAT\cartosat_names.json
# for kmz creation
METADATA_KMZ_USE_BOOUNDINGBOX=False

[metadataReport-xml-map]

[Workflow]
VERIFY_SRC_PRODUCT=False
VALIDATE_XML=True
SANITIZE_XML=True
MAX_PRODUCTS_DONE=-1
PRODUCT_OVERWRITE=False
CREATE_INDEX=False
CREATE_THUMBNAIL=False
CREATE_SHOPCART=False
CREATE_BROWSE_REPORT=False
CREATE_SIP_REPORT=False
CREATE_SYS_ITEMS=False
CREATE_KMZ=False
INDEX_ADDED_FIELD=METADATA_PROCESSING_LEVEL:@METADATA_PROCESSING_LEVEL@|METADATA_SENSOR_OPERATIONAL_MODE:@METADATA_SENSOR_OPERATIONAL_MODE@
FIXED_BATCH_NAME=cartosat
TEST_DONT_EXTRACT=False
TEST_DONT_WRITE=False
TEST_DONT_DO_BROWSE=False
TEST_JUST_EXTRACT_METADATA=True
# in GB
DISK_LOW_SPACE_LIMIT=1

[eoSip]
TYPOLOGY=OPT
VERSION=101
STORE_TYPE=SRC_PRODUCT_AS_FILE_INTO_EOZIP
STORE_COMPRESSION=False
STORE_EO_COMPRESSION=True

[Data]

[Ressources]

# the base ingester needs a non-empty [Services] section: with none it leaves
# servicesProvider unset and its own progress logging raises
[Services]
xmlValidate=HttpCall@httpService@None|./ressources/services/xmlValidate.props
remoteLogger=RemoteLoggerService@remoteLoggerService@None|./ressources/services/remoteLogger.props

# on Windows the runner, the ingester work folders and the packager use
# extended paths and a short drive alias, so a converter installed in an
# ordinary folder works without the LongPathsEnabled switch
[Paths]
WINDOWS_EXTENDED_PATHS=True
