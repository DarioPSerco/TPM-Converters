[Main]
CONFIG_NAME=dmc
MISSION_ID=dmc
CONFIG_VERSION=dmc_01
OUTSPACE=TDS\DMC\OUTSPACE
TMPSPACE=TDS\DMC\TMPSPACE
DONESPACE=TDS\DMC\DONESPACE
FAILEDSPACE=TDS\DMC\FAILEDSPACE
INBOX=TDS\DMC\INBOX

[Search]
LIST_TYPE=files
# entry file: the DIMAP header <dataset>.dim, loose in the unpacked zip
# next to the .tif, _ql.jpg, _meta.sip, .htm and .xsl. The .zip dropped in
# INBOX is unpacked by run_mission.py first (flat zip -> <zip stem>/ folder).
# Any .dim is accepted; the content checks are in product_dmc.
FILES_NAMEPATTERN=^.*$
FILES_EXTPATTERN=^\.(dim|DIM)$

[Output]
OUTPUT_RELATIVE_PATH_TREES=[]
OUTPUT_SIP_PATTERN=HIGHTRES_PATTERN_INSTANCE_GENERIC_DDVC
OUTPUT_EO_PATTERN=HIGHTRES_PATTERN_INSTANCE_GENERIC_DDVC

[Mission-specific-values]
METADATA_SIP_CHANGE_LOG=First Issue
METADATA_SIP_SPEC_NAME_VERSION=EOPF-EOS Specialization for Beijing-1, Nigeriasat-1 and UK-DMC-1 products v1.0
METADATA_SIP_SOFTWARE_NAME=eoProdGen
METADATA_SIP_SOFTWARE_VERSION=1.0.0
# <MMM> = BJ1 / NG1 / UK1 (spec Table 1) is set per product by product_dmc
# from the .dim MISSION / MISSION_INDEX. No default: a product whose
# platform is not recognised must fail, not get a wrong prefix.
METADATA_SENSOR_TYPE=OPTICAL
METADATA_ACQUISITION_TYPE=NOMINAL
METADATA_ACQUISITION_CENTER=UNKNOWN
METADATA_BROWSES_TYPE=QUICKLOOK
METADATA_CODESPACE_REFERENCE_SYSTEM=urn:esa:eop:crs
METADATA_CODESPACE_SENSOR_OPERATIONAL_MODE=urn:esa:eop:SLIM6:operationalMode
METADATA_RESOLUTION_UNIT=m
METADATA_CREATOR=ESA
METADATA_RESPONSIBLE=ESA
METADATA_REPORT_TYPE=ARCHIVING
METADATA_FILECLASS=OPER
METADATA_STATUS=ARCHIVED
METADATA_SIP_VERSION=0100
# <bbvv>: 2 digits product/processor baseline (default 00) + 2 digits counter
# (spec section 2.2), set per product by name_registry - no default here.
# Registry of the package names given, {native DATASET_NAME: package name};
# relative to the run folder like the spaces above. Keep it with the outputs:
# deleting it lets a package name be given again.
DMC_NAME_REGISTRY=TDS\DMC\dmc_names.json
# for kmz creation
METADATA_KMZ_USE_BOOUNDINGBOX=False

[metadataReport-xml-map]

[Workflow]
VERIFY_SRC_PRODUCT=False
VALIDATE_XML=True
SANITIZE_XML=True
MAX_PRODUCTS_DONE=-1
PRODUCT_OVERWRITE=False
CREATE_INDEX=False
CREATE_THUMBNAIL=False
CREATE_SHOPCART=False
CREATE_BROWSE_REPORT=False
CREATE_SIP_REPORT=False
CREATE_SYS_ITEMS=False
CREATE_KMZ=False
INDEX_ADDED_FIELD=METADATA_PROCESSING_LEVEL:@METADATA_PROCESSING_LEVEL@|METADATA_SENSOR_OPERATIONAL_MODE:@METADATA_SENSOR_OPERATIONAL_MODE@
FIXED_BATCH_NAME=dmc
TEST_DONT_EXTRACT=False
TEST_DONT_WRITE=False
TEST_DONT_DO_BROWSE=False
TEST_JUST_EXTRACT_METADATA=True
# in GB
DISK_LOW_SPACE_LIMIT=1

[eoSip]
TYPOLOGY=OPT
VERSION=101
STORE_TYPE=SRC_PRODUCT_AS_FILE_INTO_EOZIP
STORE_COMPRESSION=False
STORE_EO_COMPRESSION=True

[Data]

[Ressources]

# the base ingester needs a non-empty [Services] section: with none it leaves
# servicesProvider unset and its own progress logging raises
[Services]
xmlValidate=HttpCall@httpService@None|./ressources/services/xmlValidate.props
remoteLogger=RemoteLoggerService@remoteLoggerService@None|./ressources/services/remoteLogger.props
