[Main]
CONFIG_NAME=kompsat
MISSION_ID=kompsat
CONFIG_VERSION=kompsat_01
OUTSPACE=TDS\KOMPSAT\OUTSPACE
TMPSPACE=TDS\KOMPSAT\TMPSPACE
DONESPACE=TDS\KOMPSAT\DONESPACE
FAILEDSPACE=TDS\KOMPSAT\FAILEDSPACE
INBOX=TDS\KOMPSAT\INBOX

[Search]
LIST_TYPE=files
# entry file: the ASCII AUX metadata <image stem>.txt.
# KOMPSAT-1 (EOC_...): the metadata of the PAN image.
# KOMPSAT-2 (MSC_...): only the PAN component metadata (mode token PN) - the
# MS component (MS / M1..M4) of the bundle is converted with it, in the same
# package. RPC / readme text files are not entries.
FILES_NAMEPATTERN=(?i)^(?!.*_(?:rpc|readme)$)(?:EOC_.*|MSC_\d{12}_\d+_\d+?P[NP]\d{2}_1[RG])$
FILES_EXTPATTERN=(?i)^\.txt$

[Output]
OUTPUT_RELATIVE_PATH_TREES=[]
OUTPUT_SIP_PATTERN=HIGHTRES_PATTERN_INSTANCE_GENERIC_DDVC
OUTPUT_EO_PATTERN=HIGHTRES_PATTERN_INSTANCE_GENERIC_DDVC

[Mission-specific-values]
METADATA_SIP_CHANGE_LOG=First Issue
METADATA_SIP_SPEC_NAME_VERSION=EOPF-EOS Specialization for KOMPSAT products v1.0
METADATA_SIP_SOFTWARE_NAME=eoProdGen
METADATA_SIP_SOFTWARE_VERSION=1.0.0
# EOPF-EOS package name: <MMM>=KO1 / KO2 is built as 2-digit alias + platform id;
# the product sets the platform id from the satellite (defaults below)
METADATA_PLATFORM_2DIGITS_ALIAS=KO
METADATA_PLATFORM_ID=2
METADATA_PLATFORM=KOMPSAT-2
METADATA_SENSOR_TYPE=OPTICAL
METADATA_ACQUISITION_TYPE=NOMINAL
METADATA_ACQUISITION_CENTER=UNKNOWN
METADATA_BROWSES_TYPE=QUICKLOOK
METADATA_CODESPACE_REFERENCE_SYSTEM=urn:esa:eop:crs
METADATA_CODESPACE_SENSOR_OPERATIONAL_MODE=urn:esa:eop:KOMPSAT:operationalMode
METADATA_REFERENCE_SYSTEM_IDENTIFIER=EPSG:4326
METADATA_RESOLUTION_UNIT=m
METADATA_CREATOR=ESA
METADATA_RESPONSIBLE=ESA
METADATA_REPORT_TYPE=ARCHIVING
METADATA_FILECLASS=OPER
METADATA_ORBIT=0
METADATA_STATUS=ARCHIVED
METADATA_SIP_VERSION=0100
# <bbvv>: 2 digits product/processor version (default 00) + 2 digits counter
# starting from 00 (spec Table 1)
METADATA_PRODUCT_VERSION=0000
# for kmz creation
METADATA_KMZ_USE_BOOUNDINGBOX=False

[metadataReport-xml-map]

[Workflow]
VERIFY_SRC_PRODUCT=False
VALIDATE_XML=True
SANITIZE_XML=True
MAX_PRODUCTS_DONE=-1
PRODUCT_OVERWRITE=False
CREATE_INDEX=False
CREATE_THUMBNAIL=False
CREATE_SHOPCART=False
CREATE_BROWSE_REPORT=False
CREATE_SIP_REPORT=False
CREATE_SYS_ITEMS=False
CREATE_KMZ=False
INDEX_ADDED_FIELD=METADATA_PROCESSING_LEVEL:@METADATA_PROCESSING_LEVEL@|METADATA_SENSOR_OPERATIONAL_MODE:@METADATA_SENSOR_OPERATIONAL_MODE@
FIXED_BATCH_NAME=kompsat
TEST_DONT_EXTRACT=False
TEST_DONT_WRITE=False
TEST_DONT_DO_BROWSE=False
TEST_JUST_EXTRACT_METADATA=True
# in GB
DISK_LOW_SPACE_LIMIT=1

[eoSip]
TYPOLOGY=OPT
VERSION=101
STORE_TYPE=SRC_PRODUCT_AS_FILE_INTO_EOZIP
STORE_COMPRESSION=False
STORE_EO_COMPRESSION=True

[Data]

[Ressources]

# the base ingester needs a non-empty [Services] section: with none it leaves
# servicesProvider unset and its own progress logging raises
[Services]
xmlValidate=HttpCall@httpService@None|./ressources/services/xmlValidate.props
remoteLogger=RemoteLoggerService@remoteLoggerService@None|./ressources/services/remoteLogger.props

# on Windows the runner, the ingester work folders and the packager use
# extended paths and a short drive alias, so a converter installed in an
# ordinary folder works without the LongPathsEnabled switch
[Paths]
WINDOWS_EXTENDED_PATHS=True
