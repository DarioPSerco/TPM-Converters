[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eoSip_converter"
authors = [
    {name = "Gilles Lavaux", email = "gilles.lavaux@serco.com"},
    {name = "Simon Purser", email = "simon.purser@serco.com"},
]
requires-python = ">=3.6"
version = "1.1.0"
dependencies = [
    "numpy",
    "lxml",
    "matplotlib",
    "pillow",
    "packaging"
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["ingesters", "scripts"]
namespaces = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*"]

# short build folders: pip builds in-tree, and build/bdist.win-amd64/wheel/
# plus the deepest package paths breaks the 260-character Windows limit
[tool.distutils.build]
build_base = "b"

[tool.distutils.bdist_wheel]
bdist_dir = "b/w"
